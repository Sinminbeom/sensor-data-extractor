; sensor-data-extractor 운영 설정
; 키는 UPPER_SNAKE_CASE — sensor-data-replayer와 동일 컨벤션
[COMMON]
PROJECT_NAME = sensor-data-extractor
CHANNEL_NAME = test
SLACK_URL = http://192.168.1.79:9191/message/b64/v2/
SLACK_CHANNEL_NAME = test
DELAY_TIME = 10
TEST_SUFFIX = _TEST
TEST_PREFIX = TEST_
CAMERA_RATIO = 30

; PROCESSING: 처리 대상 센서/모듈/차량 목록
; MODULE_TYPES: AT128 | RSBP | AM20 | IMU 중 어떤 추출 파이프라인을 활성화할지
; SENSOR_NAMES: 활성화할 sensor_id list (delimiter '|')
; VEHICLE_IDS: 처리 대상 차량 list
[PROCESSING]
MODULE_TYPES = AT128 | RSBP
SENSOR_NAMES = at128_roof_front | at128_roof_right | at128_roof_rear | at128_roof_left | rsbp_bump_front | rsbp_bump_right | rsbp_bump_rear | rsbp_bump_left
VEHICLE_IDS = E100_1 | E100_2 | E100_3 | E100_4 | E100_5 | T_BENCH_2

; PROCESS: MultiProcessManager 구성
; PROCESS_COUNT: 동시 실행할 추출 process 개수 (manager 1개 + worker N개)
; JOB_QUEUE_COUNT: SharedMemory 잡 큐 개수
; VOLUMES_PLACEHOLDER: tmp 파일 분산 저장용 디스크 풀 (Docker Compose 생성기가 mount)
[PROCESS]
PROCESS_COUNT = 150
JOB_QUEUE_COUNT = 10
VOLUMES_PLACEHOLDER = /data1/sensor-data-normalization | /data2/sensor-data-normalization | /data3/sensor-data-normalization
TMP_PCAP_PATH = /tmp/pcap/
TMP_RESULT_PATH = /tmp/result/

; SRC_STORAGE: 원본 pcap 데이터 위치 — JobQueueManager가 walk + worker의 PcapMessageBuffer가 read.
; DST_STORAGE: 추출 결과 업로드 대상.
; ROOT: python-library S3StorageClient 내부 path 규약 (/bucket/key, 반드시 '/' 시작).
[SRC_STORAGE]
ROOT = /oncx-dev-common-assets-bucket/test/split

[DST_STORAGE]
ROOT = /oncx-dev-common-assets-bucket/test/extracted

[REDIS]
IP = 192.168.1.79
PORT = 6379
COM_QUEUE_NAME = REDIS_COMMUNICATION
JOB_LIST_QUEUE_NAME = REDIS_JOB_LIST_QUEUE

[REST]
BIND_IP = 0.0.0.0
BIND_PORT = 5001
